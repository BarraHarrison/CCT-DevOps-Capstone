apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bookcatalog.fullname" . }}
  labels:
    {{- include "bookcatalog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bookcatalog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bookcatalog.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "bookcatalog.postgres.fullname" . }} -p 5432 -U {{ .Values.postgres.user }}; do
                echo "Waiting for postgres...";
                sleep 2;
              done
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "bookcatalog.fullname" . }}-config
            - secretRef:
                name: {{ include "bookcatalog.fullname" . }}-secret
          readinessProbe:
            httpGet:
              path: /api/books/
              port: http
              # kubelet's httpGet probe connects directly to the pod IP and
              # sends that IP as the Host header. Django's ALLOWED_HOSTS
              # would reject that (400), so we force a Host header that
              # matches an allowed host instead of loosening ALLOWED_HOSTS.
              httpHeaders:
                - name: Host
                  value: {{ .Values.ingress.host }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/books/
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.ingress.host }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
