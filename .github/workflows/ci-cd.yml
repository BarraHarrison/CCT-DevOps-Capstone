name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Install deps & run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django test suite
        env:
          DB_ENGINE: sqlite
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "True"
        run: python manage.py test books

  build-and-push:
    name: Build & push Docker image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-application:
    name: Update image tag for ArgoCD (GitOps deploy)
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ArgoCD continuously watches this repository and auto-syncs the
      # cluster whenever chart/bookcatalog/ or environments/production/values.yaml
      # change. So "deploying" now just means updating the image tag here —
      # ArgoCD (running inside the kind cluster) picks up the change and
      # rolls it out itself. No cluster access or self-hosted runner needed
      # for this step, unlike the old direct `helm upgrade --install` job.
      - name: Update image tag in values.yaml
        uses: fjogeleit/yaml-update-action@main
        with:
          valueFile: 'environments/production/values.yaml'
          propertyPath: 'image.tag'
          value: ${{ needs.build-and-push.outputs.image_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          commitChange: true
          message: 'chore: deploy image ${{ needs.build-and-push.outputs.image_tag }} [skip ci]'
