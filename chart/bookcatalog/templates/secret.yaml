# Holds sensitive env vars separately from the ConfigMap. In this capstone
# the values come from values.yaml/--set for demo purposes; in a real
# production setup these would come from a secrets manager or be created
# out-of-band (e.g. `kubectl create secret` / sealed-secrets / external-secrets)
# rather than templated from a Helm values file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bookcatalog.fullname" . }}-secret
  labels:
    {{- include "bookcatalog.labels" . | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ .Values.secrets.djangoSecretKey | quote }}
  DB_PASSWORD: {{ .Values.postgres.password | quote }}
