apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bookcatalog.fullname" . }}-config
  labels:
    {{- include "bookcatalog.labels" . | nindent 4 }}
data:
  DJANGO_DEBUG: {{ .Values.django.debug | quote }}
  DJANGO_ALLOWED_HOSTS: {{ .Values.django.allowedHosts | quote }}
  DB_ENGINE: "postgres"
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
  DB_HOST: {{ include "bookcatalog.postgres.fullname" . | quote }}
  DB_PORT: "5432"
